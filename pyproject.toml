[project]
name = "jobserver"
version = "0.1.0"
description = "Production-grade compute orchestration and job control infrastructure"
readme = "README.md"
authors = [
    { name = "ujjawalM", email = "ujjawal.m.wal@gmail.com" }
]
requires-python = ">=3.11"
dependencies = []

[project.scripts]
jobserver = "jobserver.cli:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.16.4",
]

[tool.ruff]
line-length = 80
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort (import sorting)
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
]
ignore = []

[tool.ruff.lint.isort]
lines-after-imports = 2

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
